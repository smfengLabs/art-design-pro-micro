name: Quality Gate
displayName: '代码质量检查'
triggers:
  push:
    branches:
      include:
        - main
  pull_request:
    branches:
      include:
        - main
stages:
  - stage:
    name: check
    displayName: '执行静态检查与构建'
    steps:
      - step:
        name: setup
        displayName: '准备 Node 与 pnpm 环境'
        script: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
      - step:
        name: typecheck
        displayName: 'TypeScript 类型检查'
        script: pnpm typecheck
      - step:
        name: depcruise
        displayName: '架构依赖门禁'
        script: pnpm depcruise
      - step:
        name: build
        displayName: '全量构建'
        script: pnpm build
